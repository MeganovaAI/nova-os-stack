{{- if .Values.ingress.enabled }}
{{- $host := include "nova-os.host" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nova-os.fullname" . }}
  labels:
    {{- include "nova-os.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- if .Values.ingress.tls.wildcardSecretName }}
      secretName: {{ .Values.ingress.tls.wildcardSecretName | quote }}
      {{- else }}
      secretName: {{ include "nova-os.fullname" . }}-tls
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nova-os.fullname" . }}
                port:
                  name: http
{{- end }}
