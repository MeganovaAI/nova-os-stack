{{- if .Values.surrealdb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nova-os.fullname" . }}-surrealdb
  labels:
    {{- include "nova-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: surrealdb
spec:
  selector:
    {{- include "nova-os.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: surrealdb
  ports:
    - name: rpc
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nova-os.fullname" . }}-surrealdb
  labels:
    {{- include "nova-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: surrealdb
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.surrealdb.storage }}
  {{- with .Values.surrealdb.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nova-os.fullname" . }}-surrealdb
  labels:
    {{- include "nova-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: surrealdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nova-os.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: surrealdb
  template:
    metadata:
      labels:
        {{- include "nova-os.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: surrealdb
    spec:
      containers:
        - name: surrealdb
          image: {{ .Values.surrealdb.image }}
          args:
            - start
            - --user
            - root
            - --pass
            - $(SURREAL_PASSWORD)
            - file:/data/database.db
          env:
            - name: SURREAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nova-os.secretName" . }}
                  key: SURREAL_PASSWORD
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nova-os.fullname" . }}-surrealdb
{{- end }}
