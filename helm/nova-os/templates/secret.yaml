{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nova-os.secretName" . }}
  labels:
    {{- include "nova-os.labels" . | nindent 4 }}
type: Opaque
stringData:
  NOVA_OS_JWT_SECRET: {{ required "secrets.jwtSecret is required (openssl rand -hex 32)" .Values.secrets.jwtSecret | quote }}
  NOVA_OS_ADMIN_EMAIL: {{ required "secrets.adminEmail is required" .Values.secrets.adminEmail | quote }}
  NOVA_OS_ADMIN_PASSWORD: {{ required "secrets.adminPassword is required (>=12 chars)" .Values.secrets.adminPassword | quote }}
  NOVA_OS_DATABASE_URL: {{ include "nova-os.databaseUrl" . | quote }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.integrationKey }}
  NOVA_OS_INTEGRATION_KEY: {{ .Values.secrets.integrationKey | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required when postgres.enabled" .Values.secrets.postgresPassword | quote }}
  {{- end }}
  SURREAL_PASSWORD: {{ .Values.secrets.surrealPassword | default "root" | quote }}
{{- end }}
