# nginx reverse proxy for the single-host-prod template.
#
# Routes:
#   /                       → nova-os (admin SPA + dashboard)
#   /chat/                  → librechat (renamed from /)
#   /v1/, /agents/, /api/   → nova-os API
#   /oauth/, /.well-known/  → nova-os (OIDC)
#
# TLS terminates here; everything internal is HTTP. Certs mounted at
# /etc/nginx/certs/ from the `certs/` directory in the compose file.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Common proxy params
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $http_connection;

    # SSE streaming requires no buffering + long read timeouts.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # WebSocket / HTTP/1.1 keep-alive upgrade map.
    map $http_upgrade $http_connection {
        default upgrade;
        ''      close;
    }

    # ───── HTTP → HTTPS redirect ─────
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ───── Main TLS-terminated server ─────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # ── LibreChat under /chat/ ──
        location /chat/ {
            # Strip /chat prefix before forwarding so LibreChat sees `/`.
            rewrite ^/chat/(.*)$ /$1 break;
            proxy_pass http://librechat:3080;
        }
        location /chat {
            return 301 /chat/;
        }

        # ── Nova OS: API, OIDC, well-known, admin SPA ──
        location ~ ^/(v1|agents|api|oauth|admin|\.well-known)/ {
            proxy_pass http://nova-os:8900;
        }
        location = /health {
            proxy_pass http://nova-os:8900/health;
        }

        # ── Root: Nova OS admin SPA (default landing) ──
        location / {
            proxy_pass http://nova-os:8900;
        }
    }
}
