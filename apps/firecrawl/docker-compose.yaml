# Firecrawl OSS self-hosted — fetch + extract with strong PDF handling.
# License: AGPL-3.0 — Nova OS communicates over the documented HTTP API only
# and does not bundle Firecrawl.
#
# Notes:
#   - API is monolithic (api container runs workers in-process via harness.js).
#   - GPU is NOT used anywhere — Node + Chromium only. Do not allocate GPU.
#   - PDF extraction uses built-in fallback parser; high-quality PDFs need
#     LlamaParse (paid, intentionally not wired). Route hard PDFs through
#     Docling instead (apps/docling/).
#   - LLM-based /extract and JSON-format scrape silently degrade without
#     OPENAI_API_KEY / OLLAMA_BASE_URL. Basic /v1/scrape does not need it.
#   - Only the API port (host 3022 → container 3002) is published. Redis,
#     RabbitMQ, and nuq-postgres stay on the internal compose network.
#   - BULL_AUTH_KEY gates the /admin/<key>/queues UI.
#
# Layer on top of the root compose:
#   docker compose -f docker-compose.yml -f apps/firecrawl/docker-compose.yaml up -d
#
# Then set in the root .env (and re-up Nova OS):
#   FIRECRAWL_URL=http://firecrawl-api:3002

services:
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: nova-firecrawl-api
    restart: unless-stopped
    ports:
      - "${FIRECRAWL_PORT:-3022}:3002"
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - USE_DB_AUTHENTICATION=false
      - "BULL_AUTH_KEY=${FIRECRAWL_BULL_AUTH_KEY:?required - generate with openssl rand -hex 16}"
      - REDIS_URL=redis://firecrawl-redis:6379
      - REDIS_RATE_LIMIT_URL=redis://firecrawl-redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
      - NUQ_DATABASE_URL=postgres://postgres:postgres@firecrawl-postgres:5432/postgres
      - NUQ_RABBITMQ_URL=amqp://firecrawl-rabbitmq:5672
      - NUM_WORKERS_PER_QUEUE=8
      - LOGGING_LEVEL=info
    depends_on:
      - firecrawl-redis
      - firecrawl-rabbitmq
      - firecrawl-postgres
      - firecrawl-playwright
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
    networks:
      - nova-net

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: nova-firecrawl-playwright
    restart: unless-stopped
    environment:
      - PORT=3000
      - PROXY_SERVER=
      - PROXY_USERNAME=
      - PROXY_PASSWORD=
      - BLOCK_MEDIA=true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    networks:
      - nova-net

  firecrawl-redis:
    image: redis:alpine
    container_name: nova-firecrawl-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - nova-net

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    container_name: nova-firecrawl-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - firecrawl-rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - nova-net

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: nova-firecrawl-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - firecrawl-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - nova-net

networks:
  nova-net:
    external: true

volumes:
  firecrawl-rabbitmq-data:
  firecrawl-postgres-data:
