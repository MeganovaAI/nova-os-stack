# LibreChat configuration for Nova OS.
# Mounted read-only into the LibreChat container at /app/librechat.yaml.
version: 1.2.1
cache: true

registration:
  socialLogins:
    - openid

# Balance/credit tracking disabled — Nova OS handles quota upstream at the
# /v1/chat/completions layer. Replaces the deprecated CHECK_BALANCE env var.
balance:
  enabled: false

interface:
  endpointsMenu: true

endpoints:
  openAI:
    disabled: true
  agents:
    disableBuilder: true
    disabled: true
  custom:
    - name: "Nova OS"
      apiKey: "${NOVA_OS_API_KEY}"
      # baseURL is the Nova OS /v1/chat/completions endpoint reached from
      # inside the LibreChat container. With the root compose's `nova-net`
      # network, the Nova OS service is addressable as `nova-os`. Override
      # via the NOVA_OS_INTERNAL_URL env var if you run Nova OS outside
      # this stack — LibreChat's yaml parser only supports plain ${VAR},
      # not ${VAR:-default}, so the value is hardcoded here.
      baseURL: "http://nova-os:8900/v1"
      iconURL: "/assets/nova_os_icon.png"
      chatGptLabel: "Nova Agent"
      modelDisplayLabel: "Nova Agent"
      titleModel: "nova-orchestrator"
      titleConvo: true
      default: true
      dropParams:
        - "user"
      models:
        default:
          - "nova-orchestrator"
          - "marketing-assistant"
          - "legal-assistant"
          - "finance-assistant"
          - "hr-assistant"
          - "bi-assistant"
          - "support-assistant"
          - "email-classifier"
        fetch: false
