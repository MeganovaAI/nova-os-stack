# Arize Phoenix — open-source LLM observability platform.
# Receives OTLP traces from Nova OS and visualises them in an interactive UI.
# License: ELv2 (self-hosting permitted; SaaS redistribution requires an
# agreement with Arize).
#
# Layer on top of the root compose:
#   docker compose -f docker-compose.yml -f apps/phoenix/docker-compose.yaml up -d
#
# Then set in the root .env (and re-up Nova OS):
#   OTEL_EXPORTER_OTLP_ENDPOINT=phoenix:4317
#
# Open the Phoenix UI at http://localhost:6006 to explore traces.

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: nova-phoenix
    restart: unless-stopped
    ports:
      - "${PHOENIX_UI_PORT:-6006}:6006"   # web UI
      - "${PHOENIX_GRPC_PORT:-4317}:4317" # OTLP gRPC receiver
      - "${PHOENIX_HTTP_PORT:-4318}:4318" # OTLP HTTP receiver
    volumes:
      - phoenix-data:/mnt/phoenix
    environment:
      PHOENIX_WORKING_DIR: /mnt/phoenix
    networks:
      - nova-net

networks:
  nova-net:
    external: true

volumes:
  phoenix-data:
